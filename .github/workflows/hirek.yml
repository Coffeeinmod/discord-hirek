name: discord-hirek
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: hirek, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install feedparser
      - run: python feeds.py
        env:
          WEBHOOK_CS2: ${{ secrets.WEBHOOK_CS2 }}
          WEBHOOK_GTA: ${{ secrets.WEBHOOK_GTA }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state frissítés" && git push)
